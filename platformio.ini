; UFO Game ESP-NOW devices - one project, four device firmwares + host tests.
;
;   pio run -e hub            M5ATOM hub (USB serial <-> ESP-NOW)
;   pio run -e illumination   Illumination ATOM (LED + steam relay)
;   pio run -e m5dial_1       M5Dial #1 (ID 0x20)
;   pio run -e m5dial_2       M5Dial #2 (ID 0x21)
;   pio test -e native        host unit tests (protocol, reliability, device logic)
;   pio run -e noise          interference / broadcast-noise generator (test tool)
;   pio run -e illum_mist     standalone illumination sketch, ATOM Lite (atom_led_mist)
;   pio run -e illum_mist_s3  standalone illumination sketch, AtomS3 Lite
;
; Shared protocol code lives in shared/ (one library, used by every env).
; Device configuration lives in config/ (*.example.h are used when the real,
; git-ignored files are missing).

[platformio]
src_dir = firmware
test_dir = tests/firmware
default_envs = hub, illumination, m5dial_1, m5dial_2

[common]
build_flags =
  -std=gnu++17
  -I $PROJECT_DIR/config
  -I $PROJECT_DIR/shared
  -Wall
lib_deps_shared =
  symlink://shared

[esp32]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_ldf_mode = deep+

[env:hub]
extends = esp32
board = m5stack-atom
build_src_filter = +<hub/>
build_flags = ${common.build_flags}
lib_deps =
  ${common.lib_deps_shared}
  bblanchon/ArduinoJson@7.2.1
  fastled/FastLED@3.7.0

[env:illumination]
extends = esp32
board = m5stack-atom
build_src_filter = +<illumination/>
build_flags = ${common.build_flags}
lib_deps =
  ${common.lib_deps_shared}
  fastled/FastLED@3.7.0

[m5dial]
extends = esp32
board = m5stack-stamps3
build_src_filter = +<m5dial/>
lib_deps =
  ${common.lib_deps_shared}
  m5stack/M5Dial@1.0.3
  m5stack/M5Unified@0.3.0
  m5stack/M5GFX@0.3.0
  madhephaestus/ESP32Servo@3.0.6
  fastled/FastLED@3.7.0

[env:m5dial_1]
extends = m5dial
build_flags = ${common.build_flags} -DUFO_DEVICE_ID=0x20 -DARDUINO_USB_CDC_ON_BOOT=1

[env:m5dial_2]
extends = m5dial
build_flags = ${common.build_flags} -DUFO_DEVICE_ID=0x21 -DARDUINO_USB_CDC_ON_BOOT=1

; Standalone illumination sketch (no ESP-NOW / hub): COB tape via Atomic PWM Base,
; WS2811 tape and a mist module on Unit 2Relay, scenes switched by the button.
; Not in default_envs. Also opens as-is in the Arduino IDE.
[illum_mist]
extends = esp32
build_src_filter = +<atom_led_mist/>
build_flags = -std=gnu++17 -Wall
lib_deps =
  fastled/FastLED@3.7.0

[env:illum_mist]
extends = illum_mist
board = m5stack-atom

[env:illum_mist_s3]
extends = illum_mist
board = m5stack-atoms3
build_flags = ${illum_mist.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

; Test tool: any ESP32 (ATOM) flooding broadcast + forged frames on the channel.
[env:noise]
extends = esp32
board = m5stack-atom
build_src_filter = +<../tests/tools/noise_broadcaster/>
build_flags = ${common.build_flags}
lib_deps =
  ${common.lib_deps_shared}
  fastled/FastLED@3.7.0

; Host unit tests (Unity). Only the hardware independent logic is compiled.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  +<hub/hub_core.cpp>
  +<hub/json_bridge.cpp>
  +<illumination/illumination_controller.cpp>
  +<illumination/lighting.cpp>
  +<illumination/relay.cpp>
  +<m5dial/dial_controller.cpp>
  +<m5dial/ball_receiver.cpp>
  +<m5dial/dispenser.cpp>
build_flags =
  ${common.build_flags}
  -I $PROJECT_DIR/firmware
  -DUFO_VECTORS_PATH=\"$PROJECT_DIR/tests/protocol/vectors.json\"
lib_deps =
  ${common.lib_deps_shared}
  bblanchon/ArduinoJson@7.2.1
