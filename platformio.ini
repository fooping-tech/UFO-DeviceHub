; UFO Game ESP-NOW devices - one project, two systems x four device firmwares + host tests.
;
; Two UFO systems run in the same venue (docs/multi-system.md). Every firmware is
; built for ONE system: the env suffix _s1 / _s2 sets -DUFO_SYSTEM_ID, which
; selects that system's MAC table, channel, keys and packet magic.
;
;   pio run -e hub_s1 -t upload            M5AtomS3R hub (USB serial <-> ESP-NOW), system 1
;   pio run -e illumination_s1 -t upload   Illumination ATOM (WS2811 + COB + mist), system 1
;   pio run -e m5dial_1_s1 -t upload       M5Dial #1 (ID 0x20), system 1
;   pio run -e m5dial_2_s1 -t upload       M5Dial #2 (ID 0x21), system 1
;   pio run -e staff_remote_s1 -t upload   M5StopWatch staff remote (ID 0x30), system 1
;   ... the same with _s2 for system 2
;   pio run -e hub_atomlite_s1             hub on an ATOM Lite (status LED instead of a screen)
;   pio test -e native                     host unit tests (protocol, reliability, device logic)
;   pio run -e noise                       interference / broadcast-noise generator (test tool)
;
; Shared protocol code lives in shared/ (one library, used by every env).
; Device configuration lives in config/. The real, git-ignored devices.h and
; secrets.h are REQUIRED for device firmware (a build without them is an error:
; such a device could never talk to the hub). Compile-only check on a fresh clone:
;   PLATFORMIO_BUILD_FLAGS=-DUFO_ALLOW_EXAMPLE_CONFIG pio run

[platformio]
src_dir = firmware
test_dir = tests/firmware
default_envs = hub_s1, illumination_s1, m5dial_1_s1, m5dial_2_s1, hub_s2, illumination_s2, m5dial_1_s2, m5dial_2_s2

[common]
build_flags =
  -std=gnu++17
  -I $PROJECT_DIR/config
  -I $PROJECT_DIR/shared
  -Wall
lib_deps_shared =
  symlink://shared

[esp32]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_ldf_mode = deep+

; ---- hub: M5AtomS3R (ESP32-S3, native USB CDC, 128x128 screen) ----
[hub]
extends = esp32
board = m5stack-atoms3
build_src_filter = +<hub/>
lib_deps =
  ${common.lib_deps_shared}
  bblanchon/ArduinoJson@7.2.1
  m5stack/M5Unified@0.3.0
  m5stack/M5GFX@0.3.0
  fastled/FastLED@3.7.0          ; shared/led_effects (not used by the hub itself)
hub_flags = ${common.build_flags} -DUFO_HUB_DISPLAY=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:hub_s1]
extends = hub
build_flags = ${hub.hub_flags} -DUFO_SYSTEM_ID=1

[env:hub_s2]
extends = hub
build_flags = ${hub.hub_flags} -DUFO_SYSTEM_ID=2

; hub on an ATOM Lite (USB-UART, SK6812 status LED). Not in default_envs.
[env:hub_atomlite_s1]
extends = esp32
board = m5stack-atom
build_src_filter = +<hub/>
build_flags = ${common.build_flags} -DUFO_SYSTEM_ID=1
lib_deps =
  ${common.lib_deps_shared}
  bblanchon/ArduinoJson@7.2.1
  fastled/FastLED@3.7.0

[env:hub_atomlite_s2]
extends = env:hub_atomlite_s1
build_flags = ${common.build_flags} -DUFO_SYSTEM_ID=2

; ---- Illumination ATOM: ATOM Lite + Atomic PWM Base + Unit 2Relay ----
[illumination]
extends = esp32
board = m5stack-atom
build_src_filter = +<illumination/>
lib_deps =
  ${common.lib_deps_shared}
  fastled/FastLED@3.7.0

[env:illumination_s1]
extends = illumination
build_flags = ${common.build_flags} -DUFO_SYSTEM_ID=1

[env:illumination_s2]
extends = illumination
build_flags = ${common.build_flags} -DUFO_SYSTEM_ID=2

; ---- M5Dial x2 ----
[m5dial]
extends = esp32
board = m5stack-stamps3
build_src_filter = +<m5dial/>
lib_deps =
  ${common.lib_deps_shared}
  m5stack/M5Dial@1.0.3
  m5stack/M5Unified@0.3.0
  m5stack/M5GFX@0.3.0
  madhephaestus/ESP32Servo@3.0.6
  fastled/FastLED@3.7.0
dial_flags = ${common.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1

[env:m5dial_1_s1]
extends = m5dial
build_flags = ${m5dial.dial_flags} -DUFO_DEVICE_ID=0x20 -DUFO_SYSTEM_ID=1

[env:m5dial_2_s1]
extends = m5dial
build_flags = ${m5dial.dial_flags} -DUFO_DEVICE_ID=0x21 -DUFO_SYSTEM_ID=1

[env:m5dial_1_s2]
extends = m5dial
build_flags = ${m5dial.dial_flags} -DUFO_DEVICE_ID=0x20 -DUFO_SYSTEM_ID=2

[env:m5dial_2_s2]
extends = m5dial
build_flags = ${m5dial.dial_flags} -DUFO_DEVICE_ID=0x21 -DUFO_SYSTEM_ID=2

; ---- Staff remote: M5StopWatch (ESP32-S3R8, 16 MB flash, 8 MB OPI PSRAM), ID 0x30 ----
; Not in default_envs (one remote per system, optional). M5Unified 0.3.0 detects the StopWatch.
[staff_remote]
extends = esp32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = +<staff_remote/>
lib_deps =
  ${common.lib_deps_shared}
  m5stack/M5Unified@0.3.0
  m5stack/M5GFX@0.3.0
  fastled/FastLED@3.7.0          ; shared/led_effects (not used by the remote itself)
remote_flags = ${common.build_flags} -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

[env:staff_remote_s1]
extends = staff_remote
build_flags = ${staff_remote.remote_flags} -DUFO_SYSTEM_ID=1

[env:staff_remote_s2]
extends = staff_remote
build_flags = ${staff_remote.remote_flags} -DUFO_SYSTEM_ID=2

; Test tool: any ESP32 (ATOM) flooding broadcast + forged frames on the channel.
[env:noise]
extends = esp32
board = m5stack-atom
build_src_filter = +<../tests/tools/noise_broadcaster/>
build_flags = ${common.build_flags} -DUFO_ALLOW_EXAMPLE_CONFIG
lib_deps =
  ${common.lib_deps_shared}
  fastled/FastLED@3.7.0

; Host unit tests (Unity). Only the hardware independent logic is compiled.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  +<hub/hub_core.cpp>
  +<hub/json_bridge.cpp>
  +<illumination/illumination_controller.cpp>
  +<illumination/mist.cpp>
  +<illumination/lighting.cpp>
  +<illumination/relay.cpp>
  +<m5dial/dial_controller.cpp>
  +<m5dial/dial_led.cpp> +<m5dial/dial_scene.cpp>
  +<m5dial/ball_receiver.cpp>
  +<m5dial/dispenser.cpp>
  +<staff_remote/remote_controller.cpp>
build_flags =
  ${common.build_flags}
  -I $PROJECT_DIR/firmware
  -DUFO_ALLOW_EXAMPLE_CONFIG
  -DUFO_VECTORS_PATH=\"$PROJECT_DIR/tests/protocol/vectors.json\"
lib_deps =
  ${common.lib_deps_shared}
  bblanchon/ArduinoJson@7.2.1
